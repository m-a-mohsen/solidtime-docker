services:
  app:
    restart: always
    image: "solidtime/solidtime:${SOLIDTIME_IMAGE_TAG:-latest}"
    user: "1000:1000"
    expose:
      - "8000"
    volumes:
      - "app-storage:/var/www/html/storage"
      - "logs:/var/www/html/storage/logs"
      - "app-files:/var/www/html/storage/app"
    environment:
      CONTAINER_MODE: http
      AUTO_DB_MIGRATE: "true"
    healthcheck:
      test: [ "CMD", "curl", "--fail", "http://localhost:8000/health-check/up" ]
    depends_on:
      database:
        condition: service_healthy
  scheduler:
    restart: always
    image: "solidtime/solidtime:${SOLIDTIME_IMAGE_TAG:-latest}"
    user: "1000:1000"
    volumes:
      - "app-storage:/var/www/html/storage"
      - "logs:/var/www/html/storage/logs"
      - "app-files:/var/www/html/storage/app"
    environment:
      CONTAINER_MODE: scheduler
    healthcheck:
      test: [ "CMD", "healthcheck" ]
    depends_on:
      database:
        condition: service_healthy
  queue:
    restart: always
    image: "solidtime/solidtime:${SOLIDTIME_IMAGE_TAG:-latest}"
    user: "1000:1000"
    volumes:
      - "app-storage:/var/www/html/storage"
      - "logs:/var/www/html/storage/logs"
      - "app-files:/var/www/html/storage/app"
    environment:
      CONTAINER_MODE: worker
      WORKER_COMMAND: "php /var/www/html/artisan queue:work"
    healthcheck:
      test: [ "CMD", "healthcheck" ]
    depends_on:
      database:
        condition: service_healthy
  database:
    restart: always
    image: 'postgres:15'
#    ports:
#      - '${FORWARD_DB_PORT:-5432}:5432'
    environment:
      PGPASSWORD: '${DB_PASSWORD:-secret}'
      POSTGRES_DB: '${DB_DATABASE}'
      POSTGRES_USER: '${DB_USERNAME}'
      POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
    volumes:
      - 'database-storage:/var/lib/postgresql/data'
    healthcheck:
      test:
        - CMD
        - pg_isready
        - '-q'
        - '-d'
        - '${DB_DATABASE}'
        - '-U'
        - '${DB_USERNAME}'
      retries: 3
      timeout: 5s
  gotenberg:
    image: gotenberg/gotenberg:8
    command:
      - "gotenberg"
      - "--api-port=3003"
    healthcheck:
      test: [ "CMD", "curl", "--silent", "--fail", "http://localhost:3003/health" ]

volumes:
  database-storage:
  app-storage:
  logs:
  app-files:
